   const mystery = countries[Math.floor(Math.random() * countries.length)];
  let guessCount = 0;
  let gameOver = false;
  let score = 2500;

  function toRadians(degrees) {
    return degrees * (Math.PI / 180);
  }

  function haversineDistance(lat1, lon1, lat2, lon2) {
    const R = 6371; // Earth radius in km
    const dLat = toRadians(lat2 - lat1);
    const dLon = toRadians(lon2 - lon1);
    const a =
      Math.sin(dLat / 2) ** 2 +
      Math.cos(toRadians(lat1)) * Math.cos(toRadians(lat2)) *
      Math.sin(dLon / 2) ** 2;
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  function checkGuess() {
    if (gameOver) return;

    const guessInput = document.getElementById("guessInput").value.trim().toLowerCase();
    const guess = countries.find(c => c.name.toLowerCase() === guessInput);

    if (!guess) {
      document.getElementById("feedback").innerText = "Invalid country name.";
      return;
    }

    guessCount++;
    const distance = Math.round(haversineDistance(
      guess.lat, guess.lon, mystery.lat, mystery.lon
    ));

    previousGuesses.push({ name: guess.name, distance });
    score = Math.max(0, 2500 - (guessCount) * 100);

    updateDisplay();

    if (guess.name.toLowerCase() === mystery.name.toLowerCase()) {
      document.getElementById("feedback").innerText = `Correct! It was ${mystery.name}.`;
      gameOver = true;
    } else {
      document.getElementById("feedback").innerText = `Wrong guess. Distance: ${distance} km.`;
    }
  }

  function giveUp() {
    if (!gameOver) {
      document.getElementById("feedback").innerText = `You gave up! The correct answer was ${mystery.name}.`;
      gameOver = true;
    }
  }

  function updateDisplay() {
    const guessList = document.getElementById("previousGuesses");
    guessList.innerHTML = "";
    previousGuesses.forEach(g => {
      const li = document.createElement("li");
      li.textContent = `${g.name} — ${g.distance} km`;
      guessList.appendChild(li);
    });

    document.getElementById("guessCountDisplay").innerText = `Guesses: ${guessCount}`;
    document.getElementById("scoreDisplay").innerText = `Score: ${score}`;
  }
